# Copy into the ai-qa repo as .github/workflows/push-specs.yml, and copy backend/scripts/push-specs.mjs
# from Test Manager to .github/scripts/push-specs.mjs there (it needs only Node, no packages).
# Then add two repository secrets in ai-qa: TEST_MANAGER_API_URL (https://<your app>/api) and
# TEST_MANAGER_SYNC_TOKEN (the backend's SYNC_TOKEN).
#
# Every merge to main that changes a spec updates the test cases in Test Manager.
name: Push specs to Test Manager

on:
  push:
    branches: [main]
    paths: ['specs/**']
  workflow_dispatch:

jobs:
  push-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/push-specs.mjs specs
        env:
          API_URL: ${{ secrets.TEST_MANAGER_API_URL }}
          SYNC_TOKEN: ${{ secrets.TEST_MANAGER_SYNC_TOKEN }}
