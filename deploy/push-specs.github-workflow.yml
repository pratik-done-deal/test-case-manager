# Copy into the ai-qa repo as .github/workflows/push-specs.yml. It runs backend/scripts/push_specs.py
# there (it needs only Python, no packages).
# Then add two repository secrets in ai-qa: TEST_MANAGER_API_URL (https://<your app>/api) and
# TEST_MANAGER_SYNC_TOKEN (the backend's SYNC_TOKEN).
#
# Every merge to main that changes a spec updates the test cases in Test Manager.
name: Push specs to Test Manager

on:
  push:
    branches: [main]
    paths: ['specs/**']
  workflow_dispatch:

jobs:
  push-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python backend/scripts/push_specs.py specs
        env:
          API_URL: ${{ secrets.TEST_MANAGER_API_URL }}
          SYNC_TOKEN: ${{ secrets.TEST_MANAGER_SYNC_TOKEN }}
